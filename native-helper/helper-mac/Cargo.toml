[package]
name = "helper-mac"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Uxie native macOS helper — hotkey (fn) detection + synthetic typing"

[[bin]]
name = "miniflow-fn-helper"   # binary name kept identical to helper-win so
                              # the rest of the build pipeline doesn't branch
path = "src/main.rs"

[dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
dirs         = "5"
signal-hook  = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
