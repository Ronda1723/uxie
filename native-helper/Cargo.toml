[workspace]
resolver = "2"
members = [
    "helper-mac",
    "helper-win",
]

# `cargo build` from the workspace root would try to build *every* member,
# which fails on macOS (helper-win uses Windows-only APIs) and vice versa.
# Build the platform-specific crate explicitly, e.g.:
#   cargo build --release -p helper-mac     # on macOS
#   cargo build --release -p helper-win     # on Windows
default-members = []

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
