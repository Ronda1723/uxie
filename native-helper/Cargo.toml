[package]
name = "miniflow-fn-helper"
version = "0.4.0"
edition = "2021"
description = "MiniFlow native macOS helper — hotkey detection + synthetic typing"
license = "MIT"

[[bin]]
name = "miniflow-fn-helper"
path = "src/main.rs"

[dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
dirs         = "5"
signal-hook  = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
