[package]
name = "helper-win"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Uxie native Windows helper — Right-Alt hotkey + synthetic Unicode typing"

[[bin]]
name = "miniflow-fn-helper"
path = "src/main.rs"

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Win32 bindings. Only pulls in what we use, keeps the binary tiny.
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
