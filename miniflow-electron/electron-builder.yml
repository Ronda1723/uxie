appId: ai.uxie.app
productName: Uxie
copyright: Copyright © 2026 Uxie
directories:
  buildResources: resources
  output: dist

files:
  - build/**/*
  - package.json
  - "!**/*.map"

# Files shared across all platforms — engine bundle + tray template icons.
# The native helper binary differs per platform (.exe on Windows) so it lives
# inside the per-platform `extraResources` blocks below.
extraResources:
  - from: ../miniflow-engine/dist/miniflow-engine
    to: miniflow-engine
    filter: ["**/*"]
  - from: resources/iconTemplate.png
    to: iconTemplate.png
  - from: resources/iconTemplate@2x.png
    to: iconTemplate@2x.png

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: "Uxie needs microphone access for voice commands."
    NSAccessibilityUsageDescription: "Uxie types dictated text into the focused app."
    LSUIElement: true # menu-bar only, no dock icon
  extraResources:
    - from: ../native-helper/target/release/miniflow-fn-helper
      to: miniflow-fn-helper

win:
  target:
    - target: nsis
      arch: [x64]
  # icon: resources/icon.ico   # TODO: render a 256x256 .ico for Windows; reuse macOS PNGs in the meantime
  artifactName: ${productName}-${version}-${arch}.${ext}
  extraResources:
    - from: ../native-helper/target/release/miniflow-fn-helper.exe
      to: miniflow-fn-helper.exe

nsis:
  oneClick: false
  perMachine: false              # per-user install — no UAC prompt
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

dmg:
  writeUpdateInfo: false
