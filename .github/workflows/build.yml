name: Build

# Manually triggerable today; can be flipped to push/tag triggers later.
# We don't run on every push yet because the workflow consumes Actions
# minutes and we're still iterating fast on the macOS side.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Legacy flag (unused) — uploads to release always happen.'
        required: false
        default: 'false'
      auto_publish:
        description: 'Flip the draft release to PUBLISHED after both Mac + Windows succeed. Set to true when you are ready to ship.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

  # Tag-push trigger: pushing a `v*` tag (e.g. `git tag v1.0.27 && git push --tags`)
  # automatically builds AND publishes — useful for cutting a release from
  # your local terminal without opening the Actions UI.
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ── macOS (arm64) ────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-14   # arm64
    # Notarization queues with Apple's notary service can sit for 15-25 min
    # on top of the ~10 min build, so this needs more headroom than the
    # unsigned-build days. 60 min covers >99th percentile.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: miniflow-electron/package-lock.json

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build PyInstaller engine bundle
        run: bash build_backend.sh

      - name: Build Rust helper (helper-mac)
        run: cargo build --release -p helper-mac
        working-directory: native-helper

      - name: Install electron deps
        run: npm ci
        working-directory: miniflow-electron

      - name: Import Developer ID Application cert into a fresh keychain
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH=$RUNNER_TEMP/cert.p12

          # Decode the base64 secret into the .p12 file. Use openssl with -A
          # so whitespace/newlines from the secret store don't break decoding,
          # and printf rather than echo so no trailing newline is appended.
          printf '%s' "$MAC_CERT_P12_BASE64" | openssl base64 -d -A > "$CERT_PATH"

          # Verify the decoded blob is a real PKCS12 before we try to import.
          # PKCS12 files start with the magic bytes 0x30 0x82 (DER SEQUENCE).
          BYTES=$(wc -c < "$CERT_PATH")
          MAGIC=$(xxd -p -l 2 "$CERT_PATH")
          echo "Decoded p12: $BYTES bytes, magic=$MAGIC"
          if [ "$BYTES" -lt 1000 ] || [ "$MAGIC" != "3082" ]; then
            echo "::error::p12 looks malformed — bytes=$BYTES magic=$MAGIC (expected 3082)."
            echo "Re-encode locally with: base64 -i cert.p12 | pbcopy  and update the MAC_CERT_P12_BASE64 secret."
            exit 1
          fi

          # Create a fresh keychain so we don't pollute the runner's defaults.
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Make the new keychain the search path so codesign finds the cert.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Sanity check — must print one Developer ID Application identity.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Materialize App Store Connect API key on disk
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        # Notarytool wants a real .p8 file path. The secret stores the .p8's
        # contents base64-encoded so newlines survive the secret store and
        # CI environment unmangled. Decoded shape: a PEM-style block that
        # starts "-----BEGIN PRIVATE KEY-----" and ends "-----END PRIVATE KEY-----".
        run: |
          set -euo pipefail
          mkdir -p $RUNNER_TEMP/apikey
          P8=$RUNNER_TEMP/apikey/AuthKey_${APPLE_API_KEY_ID}.p8
          printf '%s' "$APPLE_API_KEY_P8" | openssl base64 -d -A > "$P8"
          chmod 600 "$P8"
          if ! grep -q "BEGIN PRIVATE KEY" "$P8"; then
            echo "::error::APPLE_API_KEY_P8 didn't decode to a PEM-formatted .p8 file"
            head -1 "$P8" | xxd | head -1
            exit 1
          fi
          echo "API_KEY_PATH=$P8" >> $GITHUB_ENV

      - name: Verify Apple notary credentials (fail fast)
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        # `notarytool history` is a no-op authentication probe — returns
        # in <5s on valid creds, fails with a clear error on bad ones.
        timeout-minutes: 2
        run: |
          xcrun notarytool history \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"
          echo "✓ API-key auth working"

      - name: Compile + codesign the .app
        env:
          # Let electron-builder discover the Developer ID cert from the
          # keychain we set up earlier. We disable its built-in notarize
          # because we control signing + notarization ourselves below.
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
        run: |
          npm run build
          npx electron-builder --mac --arm64 --publish never
        working-directory: miniflow-electron

      - name: Deep-sign every nested binary inside-out
        # electron-builder signs the .app envelope but the PyInstaller
        # bundle inside Contents/Resources/miniflow-engine has hundreds of
        # nested .so/.dylib files plus a Python framework. Apple's notary
        # requires every Mach-O to be signed individually with hardened
        # runtime + secure timestamp by the same Developer ID. We do this
        # manually, deepest first, then re-seal the .app.
        run: |
          set -euo pipefail
          IDENTITY="Developer ID Application: Rounak Lenka (YJMG4MF969)"
          APP="miniflow-electron/dist/mac-arm64/Uxie.app"
          ENT="miniflow-electron/resources/entitlements.mac.plist"

          # Find every Mach-O nested in Contents/Resources (PyInstaller bundle)
          # plus any executable file. Sort -r so children are signed before
          # their parent directories — Apple requires inside-out signing.
          find "$APP/Contents/Resources" \
            \( -name "*.so" -o -name "*.dylib" \) -type f -print0 \
            | sort -zr \
            | xargs -0 -P 4 -I {} codesign \
                --force --options runtime --timestamp \
                --sign "$IDENTITY" \
                --entitlements "$ENT" \
                "{}"

          # Sign any executable that isn't a .so/.dylib (PyInstaller's
          # bootstrap binary, embedded helper tools).
          find "$APP/Contents/Resources" -type f -perm -u+x \
            ! -name "*.so" ! -name "*.dylib" ! -name "*.png" ! -name "*.json" \
            ! -name "*.txt" ! -name "*.html" ! -name "*.css" ! -name "*.js" \
            ! -name "*.pyc" ! -name "*.py" -print0 2>/dev/null \
            | while IFS= read -r -d '' f; do
                if file "$f" | grep -q "Mach-O"; then
                  codesign --force --options runtime --timestamp \
                    --sign "$IDENTITY" --entitlements "$ENT" "$f"
                fi
              done

          # Re-seal the .app at the top so the inner signatures get sealed
          # in. NOT using --deep on purpose (Apple discourages it).
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" \
            --entitlements "$ENT" \
            "$APP"

      - name: Verify codesign before submitting (fail fast)
        # If anything inside the .app isn't properly signed, codesign --verify
        # catches it in 30 sec instead of waiting for Apple to reject after
        # 5 min. We do NOT use spctl here — spctl checks notarization status,
        # which isn't satisfied yet (notarize happens after this step). The
        # real spctl check runs at the very end on the stapled DMG.
        run: |
          set -euo pipefail
          APP="miniflow-electron/dist/mac-arm64/Uxie.app"
          codesign --verify --strict --verbose=2 "$APP"
          echo "--- signature details ---"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Timestamp|Runtime|Signed Time"

      - name: Repackage signed .app into a fresh DMG (with Applications shortcut)
        # The DMG electron-builder produced earlier wraps the .app from BEFORE
        # we deep-signed the PyInstaller bundle. Throw it away and build a
        # fresh DMG from a staging dir that ALSO contains an "Applications"
        # symlink so users can drag-install instead of seeing a bare app icon.
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./miniflow-electron/package.json').version")
          DMG_PATH="miniflow-electron/dist/Uxie-${VERSION}-arm64.dmg"
          rm -f miniflow-electron/dist/Uxie-*.dmg

          # Build a staging directory with the .app + an Applications symlink
          # so the mounted DMG looks like a normal "drag-to-install" volume.
          STAGING=$RUNNER_TEMP/dmg-staging
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "miniflow-electron/dist/mac-arm64/Uxie.app" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create \
            -volname "Uxie" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG_PATH"

          # Codesign the DMG itself so the staple has something to attach to.
          IDENTITY="Developer ID Application: Rounak Lenka (YJMG4MF969)"
          codesign --force --sign "$IDENTITY" --timestamp "$DMG_PATH"
          ls -la "$DMG_PATH"

      - name: Notarize DMG via API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        # API-key auth is Apple's recommended path. With proper inside-out
        # signing it usually clears in 3-8 min. --wait blocks until verdict;
        # we cap at 25 min for safety. Stapling happens immediately after.
        timeout-minutes: 30
        run: |
          set -euo pipefail
          DMG=$(ls miniflow-electron/dist/Uxie-*.dmg | head -1)
          echo "→ Submitting $DMG ($(du -h "$DMG" | cut -f1)) via API key…"
          xcrun notarytool submit "$DMG" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --timeout 25m

          echo "→ Stapling ticket onto DMG"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "→ Final spctl assessment"
          spctl --assess --type install --verbose=4 "$DMG" || true

      - name: Package signed .app as a notarised ZIP for auto-update
        # electron-updater on macOS REQUIRES a .zip of the .app for in-place
        # auto-updates (DMG can't be applied without user drag-install).
        # ditto -c -k --sequesterRsrc --keepParent is the Apple-blessed
        # way to archive a signed app bundle so the inner signatures are
        # preserved verbatim.
        run: |
          set -euo pipefail
          APP="miniflow-electron/dist/mac-arm64/Uxie.app"
          VERSION=$(node -p "require('./miniflow-electron/package.json').version")
          ZIP_PATH="miniflow-electron/dist/Uxie-${VERSION}-arm64.zip"
          rm -f "$ZIP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP_PATH"
          ls -la "$ZIP_PATH"

      - name: Generate latest-mac.yml for electron-updater
        # The YAML must reference the ZIP as the primary `path` (that's what
        # electron-updater downloads + extracts to swap the .app in place).
        # The DMG is also listed for visibility but isn't the update target.
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./miniflow-electron/package.json').version")
          DMG="miniflow-electron/dist/Uxie-${VERSION}-arm64.dmg"
          ZIP="miniflow-electron/dist/Uxie-${VERSION}-arm64.zip"
          DMG_NAME=$(basename "$DMG"); ZIP_NAME=$(basename "$ZIP")

          # base64-encoded SHA-512 of each file (electron-updater spec).
          dmg_sha512=$(shasum -a 512 "$DMG" | awk '{print $1}' | xxd -r -p | base64 | tr -d '\n')
          zip_sha512=$(shasum -a 512 "$ZIP" | awk '{print $1}' | xxd -r -p | base64 | tr -d '\n')
          dmg_size=$(wc -c < "$DMG" | tr -d ' ')
          zip_size=$(wc -c < "$ZIP" | tr -d ' ')
          DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)

          YML="miniflow-electron/dist/latest-mac.yml"
          cat > "$YML" <<EOF
          version: $VERSION
          files:
            - url: $ZIP_NAME
              sha512: $zip_sha512
              size: $zip_size
            - url: $DMG_NAME
              sha512: $dmg_sha512
              size: $dmg_size
          path: $ZIP_NAME
          sha512: $zip_sha512
          releaseDate: '$DATE'
          EOF
          echo "→ Generated $YML"
          cat "$YML"

      - uses: actions/upload-artifact@v4
        with:
          name: Uxie-macos-arm64
          path: |
            miniflow-electron/dist/*.dmg
            miniflow-electron/dist/*.zip
            miniflow-electron/dist/latest-mac.yml
          if-no-files-found: error

      - name: Publish DMG to uxie-app/uxie-releases as a draft release
        # Drops the notarized DMG into the public releases repo so anyone in
        # the world can download via GitHub's release CDN (Fastly, multi-PoP)
        # instead of going through GitHub Actions artifacts (single-region,
        # auth-only, no CDN — slow from India and Asia in particular).
        #
        # We create as a DRAFT so the public doesn't see every CI run; flip
        # to published from the releases page when ready to ship.
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./miniflow-electron/package.json').version")
          TAG="v$VERSION"
          DMG=$(ls miniflow-electron/dist/Uxie-*.dmg | head -1)
          ZIP=$(ls miniflow-electron/dist/Uxie-*.zip | head -1)
          YML=miniflow-electron/dist/latest-mac.yml
          REPO="uxie-app/uxie-releases"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "→ Release $TAG exists, uploading DMG + ZIP + latest-mac.yml"
          else
            echo "→ Creating draft release $TAG"
            gh release create "$TAG" \
              --repo "$REPO" \
              --draft \
              --title "Uxie $TAG" \
              --notes "Built from uxie-app/uxie@${GITHUB_SHA::7}"
            sleep 5
          fi
          gh release upload "$TAG" "$DMG" "$ZIP" "$YML" --repo "$REPO" --clobber
          echo "✓ DMG + ZIP + latest-mac.yml uploaded to https://github.com/$REPO/releases/tag/$TAG"

  # ── Windows (x64) ────────────────────────────────────────────────────────
  # First-class Windows builds run here so they don't depend on a laptop.
  # The runner has Node + Python + MSVC out of the box; we only need to
  # add Rust.
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: miniflow-electron/package-lock.json

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Rust (stable, MSVC ABI)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Build PyInstaller engine bundle (Windows)
        # build_backend.sh is bash; on Windows runners it works because
        # the runner ships with Git Bash. If we ever want native PowerShell
        # we'd add a build_backend.ps1 mirror.
        shell: bash
        run: bash build_backend.sh

      - name: Build Rust helper (helper-win)
        run: cargo build --release -p helper-win
        working-directory: native-helper

      - name: Install electron deps
        run: npm ci
        working-directory: miniflow-electron

      - name: Compile + package
        # No Authenticode signing in CI yet; that requires the EV cert
        # ($300-500/yr) which we'll wire when public-launch ready.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          npm run build
          npx electron-builder --win --x64 --publish never
        working-directory: miniflow-electron

      - name: Generate latest.yml for electron-updater (Windows)
        # electron-builder writes latest.yml itself for --win, but we
        # double-check it exists and regenerate from scratch if it's
        # missing (some electron-builder versions skip yml when
        # --publish=never).
        shell: bash
        run: |
          set -euo pipefail
          cd miniflow-electron
          if [ ! -f dist/latest.yml ]; then
            EXE=$(ls dist/Uxie*.exe | head -1)
            EXE_NAME=$(basename "$EXE")
            VERSION=$(node -p "require('./package.json').version")
            SIZE=$(wc -c < "$EXE" | tr -d ' ')
            SHA512=$(certutil -hashfile "$EXE" SHA512 | sed -n 2p | tr -d ' \r\n' | xxd -r -p | base64 -w0 || \
              sha512sum "$EXE" | awk '{print $1}' | xxd -r -p | base64 -w0)
            DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
            cat > dist/latest.yml <<EOF
          version: $VERSION
          files:
            - url: $EXE_NAME
              sha512: $SHA512
              size: $SIZE
          path: $EXE_NAME
          sha512: $SHA512
          releaseDate: '$DATE'
          EOF
          fi
          echo "→ latest.yml:"
          cat dist/latest.yml

      - uses: actions/upload-artifact@v4
        with:
          name: Uxie-windows-x64
          path: |
            miniflow-electron/dist/*.exe
            miniflow-electron/dist/latest.yml
          if-no-files-found: error

      - name: Publish EXE to uxie-app/uxie-releases as a draft release
        # Same global-CDN distribution path as the Mac job. Both jobs target
        # the same tag so the release ends up with both DMG + EXE under one
        # version, matching the "Mac+Win paired release" rule.
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./miniflow-electron/package.json').version")
          TAG="v$VERSION"
          EXE=$(ls miniflow-electron/dist/Uxie*.exe | head -1)
          YML=miniflow-electron/dist/latest.yml
          REPO="uxie-app/uxie-releases"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "→ Release $TAG exists, uploading EXE + latest.yml"
          else
            echo "→ Creating draft release $TAG"
            gh release create "$TAG" \
              --repo "$REPO" \
              --draft \
              --title "Uxie $TAG" \
              --notes "Built from uxie-app/uxie@${GITHUB_SHA::7}"
            sleep 5
          fi
          gh release upload "$TAG" "$EXE" "$YML" --repo "$REPO" --clobber
          echo "✓ EXE + latest.yml uploaded to https://github.com/$REPO/releases/tag/$TAG"

  # ── Auto-publish (optional) ─────────────────────────────────────────────
  # Flips the draft release to PUBLISHED once both Mac + Windows succeed.
  # Triggered automatically when:
  #   - the workflow was kicked off by pushing a `v*.*.*` tag, OR
  #   - workflow_dispatch was run with auto_publish = 'true'
  #
  # Otherwise the release stays draft and the developer can publish via
  # the GitHub UI when ready. This keeps "build for testing" and "ship to
  # users" as separate explicit actions.
  publish-release:
    needs: [build-macos, build-windows]
    if: success() && (github.event_name == 'push' || github.event.inputs.auto_publish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Flip draft → published on uxie-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          # On tag push GITHUB_REF_NAME is the tag (e.g. v1.0.27).
          # On workflow_dispatch we read the version from package.json on
          # the same commit and derive the tag.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            # No package.json here — pull from the repo via the API.
            VERSION=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/uxie-app/uxie/contents/miniflow-electron/package.json?ref=${GITHUB_SHA}" \
              | python3 -c "import sys,json,base64; raw=base64.b64decode(json.load(sys.stdin)['content']); print(json.loads(raw)['version'])")
            TAG="v$VERSION"
          fi
          echo "→ Publishing release $TAG on uxie-app/uxie-releases"
          gh release edit "$TAG" --repo uxie-app/uxie-releases --draft=false
          echo "✓ $TAG is now public:"
          echo "  https://github.com/uxie-app/uxie-releases/releases/tag/$TAG"
