name: Build

# Manually triggerable today; can be flipped to push/tag triggers later.
# We don't run on every push yet because the workflow consumes Actions
# minutes and we're still iterating fast on the macOS side.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload artifacts to a GitHub Release (requires tag or version input)'
        required: false
        default: 'false'

jobs:
  # ── macOS (arm64) ────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-14   # arm64
    # Notarization queues with Apple's notary service can sit for 15-25 min
    # on top of the ~10 min build, so this needs more headroom than the
    # unsigned-build days. 60 min covers >99th percentile.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: miniflow-electron/package-lock.json

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build PyInstaller engine bundle
        run: bash build_backend.sh

      - name: Build Rust helper (helper-mac)
        run: cargo build --release -p helper-mac
        working-directory: native-helper

      - name: Install electron deps
        run: npm ci
        working-directory: miniflow-electron

      - name: Import Developer ID Application cert into a fresh keychain
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH=$RUNNER_TEMP/cert.p12

          # Decode the base64 secret into the .p12 file. Use openssl with -A
          # so whitespace/newlines from the secret store don't break decoding,
          # and printf rather than echo so no trailing newline is appended.
          printf '%s' "$MAC_CERT_P12_BASE64" | openssl base64 -d -A > "$CERT_PATH"

          # Verify the decoded blob is a real PKCS12 before we try to import.
          # PKCS12 files start with the magic bytes 0x30 0x82 (DER SEQUENCE).
          BYTES=$(wc -c < "$CERT_PATH")
          MAGIC=$(xxd -p -l 2 "$CERT_PATH")
          echo "Decoded p12: $BYTES bytes, magic=$MAGIC"
          if [ "$BYTES" -lt 1000 ] || [ "$MAGIC" != "3082" ]; then
            echo "::error::p12 looks malformed — bytes=$BYTES magic=$MAGIC (expected 3082)."
            echo "Re-encode locally with: base64 -i cert.p12 | pbcopy  and update the MAC_CERT_P12_BASE64 secret."
            exit 1
          fi

          # Create a fresh keychain so we don't pollute the runner's defaults.
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Make the new keychain the search path so codesign finds the cert.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Sanity check — must print one Developer ID Application identity.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Materialize App Store Connect API key on disk
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        # Notarytool wants a real .p8 file path. The secret stores the .p8's
        # contents base64-encoded so newlines survive the secret store and
        # CI environment unmangled. Decoded shape: a PEM-style block that
        # starts "-----BEGIN PRIVATE KEY-----" and ends "-----END PRIVATE KEY-----".
        run: |
          set -euo pipefail
          mkdir -p $RUNNER_TEMP/apikey
          P8=$RUNNER_TEMP/apikey/AuthKey_${APPLE_API_KEY_ID}.p8
          printf '%s' "$APPLE_API_KEY_P8" | openssl base64 -d -A > "$P8"
          chmod 600 "$P8"
          if ! grep -q "BEGIN PRIVATE KEY" "$P8"; then
            echo "::error::APPLE_API_KEY_P8 didn't decode to a PEM-formatted .p8 file"
            head -1 "$P8" | xxd | head -1
            exit 1
          fi
          echo "API_KEY_PATH=$P8" >> $GITHUB_ENV

      - name: Verify Apple notary credentials (fail fast)
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        # `notarytool history` is a no-op authentication probe — returns
        # in <5s on valid creds, fails with a clear error on bad ones.
        timeout-minutes: 2
        run: |
          xcrun notarytool history \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --output-format plain
          echo "✓ API-key auth working"

      - name: Compile + codesign the .app
        env:
          # Let electron-builder discover the Developer ID cert from the
          # keychain we set up earlier. We disable its built-in notarize
          # because we control signing + notarization ourselves below.
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
        run: |
          npm run build
          npx electron-builder --mac --arm64 --publish never
        working-directory: miniflow-electron

      - name: Deep-sign every nested binary inside-out
        # electron-builder signs the .app envelope but the PyInstaller
        # bundle inside Contents/Resources/miniflow-engine has hundreds of
        # nested .so/.dylib files plus a Python framework. Apple's notary
        # requires every Mach-O to be signed individually with hardened
        # runtime + secure timestamp by the same Developer ID. We do this
        # manually, deepest first, then re-seal the .app.
        run: |
          set -euo pipefail
          IDENTITY="Developer ID Application: Rounak Lenka (YJMG4MF969)"
          APP="miniflow-electron/dist/mac-arm64/Uxie.app"
          ENT="miniflow-electron/resources/entitlements.mac.plist"

          # Find every Mach-O nested in Contents/Resources (PyInstaller bundle)
          # plus any executable file. Sort -r so children are signed before
          # their parent directories — Apple requires inside-out signing.
          find "$APP/Contents/Resources" \
            \( -name "*.so" -o -name "*.dylib" \) -type f -print0 \
            | sort -zr \
            | xargs -0 -P 4 -I {} codesign \
                --force --options runtime --timestamp \
                --sign "$IDENTITY" \
                --entitlements "$ENT" \
                "{}"

          # Sign any executable that isn't a .so/.dylib (PyInstaller's
          # bootstrap binary, embedded helper tools).
          find "$APP/Contents/Resources" -type f -perm -u+x \
            ! -name "*.so" ! -name "*.dylib" ! -name "*.png" ! -name "*.json" \
            ! -name "*.txt" ! -name "*.html" ! -name "*.css" ! -name "*.js" \
            ! -name "*.pyc" ! -name "*.py" -print0 2>/dev/null \
            | while IFS= read -r -d '' f; do
                if file "$f" | grep -q "Mach-O"; then
                  codesign --force --options runtime --timestamp \
                    --sign "$IDENTITY" --entitlements "$ENT" "$f"
                fi
              done

          # Re-seal the .app at the top so the inner signatures get sealed
          # in. NOT using --deep on purpose (Apple discourages it).
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" \
            --entitlements "$ENT" \
            "$APP"

      - name: Verify codesign + spctl before submitting (fail fast)
        # If anything inside the .app isn't properly signed, this catches
        # it in 30 sec instead of waiting for Apple to reject after 5 min.
        run: |
          set -euo pipefail
          APP="miniflow-electron/dist/mac-arm64/Uxie.app"
          codesign --verify --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Timestamp|Runtime"
          spctl --assess --type execute --verbose=4 "$APP" 2>&1 | head -10

      - name: Repackage signed .app into a fresh DMG
        # The DMG electron-builder produced earlier wraps the .app from BEFORE
        # we deep-signed the PyInstaller bundle. Throw it away and build a
        # fresh DMG with hdiutil from the now-correctly-signed .app. Using
        # hdiutil directly (instead of re-running electron-builder) avoids
        # surprise re-signing.
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./miniflow-electron/package.json').version")
          DMG_PATH="miniflow-electron/dist/Uxie-${VERSION}-arm64.dmg"
          rm -f miniflow-electron/dist/Uxie-*.dmg
          hdiutil create \
            -volname "Uxie" \
            -srcfolder "miniflow-electron/dist/mac-arm64/Uxie.app" \
            -ov -format UDZO \
            "$DMG_PATH"
          # Codesign the DMG itself so the staple has something to attach to.
          IDENTITY="Developer ID Application: Rounak Lenka (YJMG4MF969)"
          codesign --force --sign "$IDENTITY" --timestamp "$DMG_PATH"
          ls -la "$DMG_PATH"

      - name: Notarize DMG via API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        # API-key auth is Apple's recommended path. With proper inside-out
        # signing it usually clears in 3-8 min. --wait blocks until verdict;
        # we cap at 25 min for safety. Stapling happens immediately after.
        timeout-minutes: 30
        run: |
          set -euo pipefail
          DMG=$(ls miniflow-electron/dist/Uxie-*.dmg | head -1)
          echo "→ Submitting $DMG ($(du -h "$DMG" | cut -f1)) via API key…"
          xcrun notarytool submit "$DMG" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --timeout 25m

          echo "→ Stapling ticket onto DMG"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "→ Final spctl assessment"
          spctl --assess --type install --verbose=4 "$DMG" || true

      - uses: actions/upload-artifact@v4
        with:
          name: Uxie-macos-arm64
          path: miniflow-electron/dist/*.dmg
          if-no-files-found: error

  # ── Windows (x64) ────────────────────────────────────────────────────────
  # First-class Windows builds run here so they don't depend on a laptop.
  # The runner has Node + Python + MSVC out of the box; we only need to
  # add Rust.
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: miniflow-electron/package-lock.json

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Rust (stable, MSVC ABI)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Build PyInstaller engine bundle (Windows)
        # build_backend.sh is bash; on Windows runners it works because
        # the runner ships with Git Bash. If we ever want native PowerShell
        # we'd add a build_backend.ps1 mirror.
        shell: bash
        run: bash build_backend.sh

      - name: Build Rust helper (helper-win)
        run: cargo build --release -p helper-win
        working-directory: native-helper

      - name: Install electron deps
        run: npm ci
        working-directory: miniflow-electron

      - name: Compile + package
        # No Authenticode signing in CI yet; that requires the EV cert
        # ($300-500/yr) which we'll wire when public-launch ready.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          npm run build
          npx electron-builder --win --x64 --publish never
        working-directory: miniflow-electron

      - uses: actions/upload-artifact@v4
        with:
          name: Uxie-windows-x64
          path: miniflow-electron/dist/*.exe
          if-no-files-found: error
