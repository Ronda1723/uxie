name: Build

# Manually triggerable today; can be flipped to push/tag triggers later.
# We don't run on every push yet because the workflow consumes Actions
# minutes and we're still iterating fast on the macOS side.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload artifacts to a GitHub Release (requires tag or version input)'
        required: false
        default: 'false'

jobs:
  # ── macOS (arm64) ────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-14   # arm64
    # Notarization queues with Apple's notary service can sit for 15-25 min
    # on top of the ~10 min build, so this needs more headroom than the
    # unsigned-build days. 60 min covers >99th percentile.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: miniflow-electron/package-lock.json

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build PyInstaller engine bundle
        run: bash build_backend.sh

      - name: Build Rust helper (helper-mac)
        run: cargo build --release -p helper-mac
        working-directory: native-helper

      - name: Install electron deps
        run: npm ci
        working-directory: miniflow-electron

      - name: Import Developer ID Application cert into a fresh keychain
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH=$RUNNER_TEMP/cert.p12

          # Decode the base64 secret into the .p12 file. Use openssl with -A
          # so whitespace/newlines from the secret store don't break decoding,
          # and printf rather than echo so no trailing newline is appended.
          printf '%s' "$MAC_CERT_P12_BASE64" | openssl base64 -d -A > "$CERT_PATH"

          # Verify the decoded blob is a real PKCS12 before we try to import.
          # PKCS12 files start with the magic bytes 0x30 0x82 (DER SEQUENCE).
          BYTES=$(wc -c < "$CERT_PATH")
          MAGIC=$(xxd -p -l 2 "$CERT_PATH")
          echo "Decoded p12: $BYTES bytes, magic=$MAGIC"
          if [ "$BYTES" -lt 1000 ] || [ "$MAGIC" != "3082" ]; then
            echo "::error::p12 looks malformed — bytes=$BYTES magic=$MAGIC (expected 3082)."
            echo "Re-encode locally with: base64 -i cert.p12 | pbcopy  and update the MAC_CERT_P12_BASE64 secret."
            exit 1
          fi

          # Create a fresh keychain so we don't pollute the runner's defaults.
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Make the new keychain the search path so codesign finds the cert.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Sanity check — must print one Developer ID Application identity.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Verify Apple notary credentials (fail fast)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # `notarytool history` is a no-op authentication probe — it returns
        # in <5s on valid creds (printing prior submissions or "No results
        # found"), and fails with a clear error on bad ones. Without this
        # check, a wrong app-specific password can silently hang the
        # subsequent electron-builder step for 30+ minutes.
        timeout-minutes: 2
        run: |
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --output-format plain || true
          # Empty submission history is fine (echo a marker so we know we
          # actually returned from the call rather than being killed).
          echo "credentials check returned"

      - name: Compile, sign, and notarize
        env:
          # electron-builder picks these up automatically for codesign + notarize.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # We have a real Developer ID cert in the keychain now, let
          # electron-builder discover and use it.
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          # Make notarytool's progress visible in the build log.
          DEBUG: 'electron-builder,electron-notarize*'
        run: |
          npm run build
          npx electron-builder --mac --arm64 --publish never
        working-directory: miniflow-electron

      - uses: actions/upload-artifact@v4
        with:
          name: Uxie-macos-arm64
          path: miniflow-electron/dist/*.dmg
          if-no-files-found: error

  # ── Windows (x64) ────────────────────────────────────────────────────────
  # First-class Windows builds run here so they don't depend on a laptop.
  # The runner has Node + Python + MSVC out of the box; we only need to
  # add Rust.
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: miniflow-electron/package-lock.json

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Rust (stable, MSVC ABI)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Build PyInstaller engine bundle (Windows)
        # build_backend.sh is bash; on Windows runners it works because
        # the runner ships with Git Bash. If we ever want native PowerShell
        # we'd add a build_backend.ps1 mirror.
        shell: bash
        run: bash build_backend.sh

      - name: Build Rust helper (helper-win)
        run: cargo build --release -p helper-win
        working-directory: native-helper

      - name: Install electron deps
        run: npm ci
        working-directory: miniflow-electron

      - name: Compile + package
        # No Authenticode signing in CI yet; that requires the EV cert
        # ($300-500/yr) which we'll wire when public-launch ready.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          npm run build
          npx electron-builder --win --x64 --publish never
        working-directory: miniflow-electron

      - uses: actions/upload-artifact@v4
        with:
          name: Uxie-windows-x64
          path: miniflow-electron/dist/*.exe
          if-no-files-found: error
